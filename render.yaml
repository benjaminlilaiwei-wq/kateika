services:
  - type: web
    name: cookquest
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.0-flash
      - key: NODE_VERSION
        value: "20"
